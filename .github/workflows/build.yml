name: Build and release

# Builds the installer on every push to master and on pull requests (PR builds appear as download links on the PR).
# To publish a release: Actions > Build and release > Run workflow. The version box says "next"
# (last release + 1); type a number to choose one, or clear it to only test the build.
# The version is written into KeyHookTest.rc for that build, so the exe and installer report it.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version. "next" = last release + 1 (for example 1.3 after 1.2), or type one (for example 2.0). Empty = only test the build, no release.'
        required: false
        default: 'next'

permissions:
  contents: write   # needed to publish releases

jobs:
  version:
    # Works out the release version: from the Run workflow box ("next" = last release + 1)
    # or from a pushed v* tag. Empty means "only test the build, no release".
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT: ${{ inputs.version }}
        run: |
          v=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=$(printf '%s' "$GITHUB_REF_NAME" | grep -oE '[0-9]+(\.[0-9]+)*$' || true)
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$INPUT" ]; then
            if [ "$INPUT" = next ]; then
              last=$(gh api "repos/$REPO/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name][0] // ""')
              num=$(printf '%s' "$last" | grep -oE '[0-9]+(\.[0-9]+)*$' || true)
              if [ -z "$num" ]; then v=1.0; else v=$(printf '%s' "$num" | awk -F. -v OFS=. '{$NF=$NF+1; print}'); fi
              echo "Last release: ${last:-none}"
            else
              v="${INPUT#[vV]}"
            fi
          fi
          if [ -n "$v" ] && ! printf '%s' "$v" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::'$v' is not a version number. Use numbers like 1.4 or 2.0.1, or 'next'."; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=${v:+v$v}" >> "$GITHUB_OUTPUT"
          if [ -n "$v" ]; then echo "### Releasing v$v" >> "$GITHUB_STEP_SUMMARY"; else echo "### Test build only, no release" >> "$GITHUB_STEP_SUMMARY"; fi

  build:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Set the release version
        if: needs.version.outputs.version != ''
        shell: pwsh
        run: |
          $p = @("${{ needs.version.outputs.version }}".Split('.')) + @('0','0','0')
          $v3 = "$($p[0]).$($p[1]).$($p[2])"
          $rc = 'Sources/TestApp/KeyHookTest.rc'
          $t = Get-Content $rc -Raw
          $t = $t -replace '(FILEVERSION|PRODUCTVERSION) \d+,\d+,\d+,\d+', "`$1 $($p[0]),$($p[1]),$($p[2]),0"
          $t = $t -replace '("(File|Product)Version",\s*")[\d.]+', "`${1}$v3.0"
          Set-Content $rc $t -NoNewline
          Select-String -Path $rc -Pattern 'VERSION|Version"'

      - name: Build binaries and installer
        shell: pwsh
        run: ./build.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TouchFreeze-setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: needs.version.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: TouchFreeze ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          generate_release_notes: true
